spring:
  application:
    name: saimeng-admin
  datasource:
    url: jdbc:h2:file:./data/saimeng-mall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
